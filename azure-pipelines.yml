# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool: NFUProjectAVMPool

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- bash: |
    curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
    az --version

- task: AzureCLI@2
  inputs:
     azureSubscription: sc-infra-deploy
     scriptType: bash
     scriptLocation: inlineScript
     inlineScript: |
        echo "Logged into AZure"
        az account show
        az deployment sub what-if -l uksouth --template-file azure-avm-scripts/rg-avm.bicep
        az deployment sub create -l uksouth --template-file azure-avm-scripts/rg-avm.bicep
